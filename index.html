<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kolony Vibe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--border:#6C5EB5;--screen:#352879;--text:#B3ADFF;--white:#fff;--yellow:#E3EA9A;--green:#A6E08F;--red:#FF9F90;--cyan:#9ADCE8;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--border)}
body{font-family:'VT323',monospace;font-size:21px;line-height:1.15;color:var(--text);padding:12px;min-height:100vh}
.screen{background:var(--screen);max-width:780px;margin:0 auto;padding:14px 14px 0;min-height:calc(100vh - 24px);position:relative}
h1{font-family:'Press Start 2P',monospace;font-size:17px;color:var(--white);margin:4px 0 6px;letter-spacing:1px}
.sub{color:var(--cyan)}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:12px 0}
@media(min-width:620px){.res{grid-template-columns:repeat(4,1fr)}}
.tile{border:2px solid var(--text);padding:4px 7px}
.tile .l{font-size:17px;color:var(--cyan);text-transform:uppercase}
.tile .v{font-size:25px;color:var(--white)}
.tile .v.neg{color:var(--red)}
.d{font-size:17px;margin-left:4px}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--yellow)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 10px}
button{font-family:'VT323',monospace;font-size:21px;background:var(--text);color:var(--screen);border:0;padding:4px 10px;cursor:pointer;border-radius:0}
button:hover{background:var(--white)}
button:disabled{opacity:.35;cursor:not-allowed;background:var(--text)}
.tabs button{background:transparent;color:var(--text);border:2px solid var(--text)}
.tabs button.on{background:var(--text);color:var(--screen)}
.panel{min-height:240px;padding-bottom:90px}
.card{border-top:2px dashed var(--border);padding:8px 0}
.card .t{color:var(--white);font-size:23px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.small{font-size:18px}
.log p{margin:3px 0}
.log p::before{content:"> ";color:var(--cyan)}
.bar{position:sticky;bottom:0;background:var(--screen);padding:10px 0 14px;border-top:2px solid var(--border);display:flex;gap:6px;align-items:center}
.bar .go{flex:1;font-size:26px;padding:8px;background:var(--yellow)}
.bar .go:hover{background:var(--white)}
.bar button{white-space:nowrap}
@media(max-width:480px){.bar .go{font-size:21px;padding:8px 4px}}
input[type=range]{width:100%;accent-color:var(--yellow)}
.qty button{min-width:52px}
.qty button.on{background:var(--yellow)}
.pr{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.pr button{font-size:18px;padding:2px 8px}.pr button.on{background:var(--yellow)}
.overlay{position:fixed;inset:0;background:var(--border);display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
.overlay .box{background:var(--screen);max-width:620px;width:100%;padding:20px;max-height:92vh;overflow:auto}
.cursor{display:inline-block;width:12px;height:20px;background:var(--text);vertical-align:-3px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.hidden{display:none}
.cost2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.dev{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:3px 14px;margin:4px 0 10px}
.dev label{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:18px}
.dev input[type=number]{font-family:'VT323',monospace;font-size:18px;width:80px;background:#241b5e;color:var(--white);border:1px solid var(--text);padding:0 4px}
.dev input[type=checkbox]{accent-color:var(--yellow);width:18px;height:18px}
.devh{color:var(--cyan);margin-top:10px}
#ovbox .btns button{font-size:18px}
.tw{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--screen);animation:twin .08s linear forwards;pointer-events:none}
.tw.out{animation:twout .2s linear forwards}
.tw::before{content:'';position:absolute;inset:0;opacity:.55;background:repeating-linear-gradient(0deg,var(--border) 0 6px,var(--screen) 6px 12px,var(--cyan) 12px 15px,var(--screen) 15px 22px);animation:twr .12s steps(2) infinite}
.tw .twb{position:relative;background:var(--screen);border:2px solid var(--text);padding:18px 22px;min-width:260px;text-align:center}
.tw .twt{font-family:'Press Start 2P',monospace;font-size:15px;color:var(--white);line-height:1.8}
.tw .meter i{width:0;background:var(--yellow);transition:width .25s steps(4)}
@keyframes twin{from{opacity:0}to{opacity:1}}
@keyframes twout{from{opacity:1}to{opacity:0}}
@keyframes twr{to{background-position:0 22px}}
@media(prefers-reduced-motion:reduce){.tw::before{animation:none}}
.ic{width:1em;height:1em;vertical-align:-.12em;margin-right:5px;shape-rendering:crispEdges}
.tile .l .ic{width:1.15em;height:1.15em}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.meter{height:10px;background:#241b5e;border:1px solid var(--text);margin-top:3px}
.meter i{display:block;height:100%;background:var(--green)}
.meter i.warn{background:var(--yellow)}.meter i.neg{background:var(--red)}
.tile .meter{height:6px;margin:2px 0 3px}
.card .meter{margin-top:5px}
</style>
</head>
<body>
<div class="screen">
  <h1>KOLONY<span class="sub"> VIBE</span></h1>
  <div class="row small"><span id="date"></span><span id="goal" class="warn"></span></div>
  <div class="row small" style="margin-top:6px"><span>KADENCJA GUBERNATORA</span><span id="tlab"></span></div>
  <div class="meter" id="tbar"><i></i></div>
  <div class="res" id="res"></div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>
  <div class="bar">
    <button class="go" id="go">▶ KONIEC DNIA</button>
    <button id="go7" title="Przewiń do 7 dni – zatrzymuje się przy ważnych wydarzeniach">▶▶ 7 DNI</button>
    <button id="dev" class="hidden" title="Menu deweloperskie">DEV</button>
    <button id="menu" title="Menu">≡</button>
  </div>
</div>

<div class="overlay" id="ov"><div class="box" id="ovbox"></div></div>

<script>
// p – produkcja dziennie, w – pracownicy, en – zużycie energii kWh/dzień,
// crew – maks. liczba budowniczych, bt – praca potrzebna do budowy (osobodni)
const BLD={
 farm:{n:'Farma hydroponiczna',cr:120,mi:40,w:10,en:1.5,p:8,crew:5,bt:30,d:'+8 t żywności dziennie'},
 power:{n:'Elektrownia słoneczna',cr:150,mi:60,w:6,en:0,p:10,crew:5,bt:35,d:'+10 kWh energii dziennie'},
 battery:{n:'Bateria',cr:130,mi:70,w:1,en:0,crew:3,bt:15,d:'+100 kWh pojemności magazynu energii'},
 store:{n:'Magazyn',cr:110,mi:40,w:2,en:0.5,crew:4,bt:20,d:'+250 t miejsca na żywność i minerały'},
 mine:{n:'Kopalnia',cr:140,mi:20,w:12,en:2,p:6,crew:6,bt:50,d:'+6 t minerałów dziennie'},
 house:{n:'Moduł mieszkalny',cr:100,mi:50,w:2,en:1,crew:4,bt:20,d:'+60 miejsc'},
 rec:{n:'Centrum rekreacji',cr:200,mi:60,w:6,en:1.5,crew:6,bt:50,d:'podnosi morale'},
 lab:{n:'Laboratorium',cr:250,mi:80,w:8,en:2,p:2,crew:8,bt:80,d:'+2 pkt badań dziennie'},
 port:{n:'Port kosmiczny',cr:600,mi:250,w:15,en:3.5,p:13,crew:15,bt:300,d:'+13 kr handlu dziennie, imigranci, lepsze ceny',max:1},
 shield:{n:'Osłona orbitalna',cr:180,mi:90,w:0,en:0.5,crew:6,bt:60,d:'przechwytuje jeden deszcz meteorytów i ulega zniszczeniu',req:'shield'}
};
const TECH={
 hydro:{n:'Ulepszona hydroponika',c:40,d:'Farmy +30%'},
 graph:{n:'Panele grafenowe',c:50,d:'Elektrownie +30%'},
 drill:{n:'Głębokie wiercenia',c:60,d:'Kopalnie +30%'},
 med:{n:'Medycyna kosmiczna',c:80,d:'Przyrost +30%, słabsze epidemie'},
 auto:{n:'Automatyzacja',c:90,d:'Budynki i budowy potrzebują o 25% mniej pracowników'},
 shield:{n:'Osłony orbitalne',c:110,d:'Pozwala budować osłony orbitalne chroniące przed meteorytami'}
};
const RES={food:{n:'Żywność',base:4},min:{n:'Minerały',base:6}};
// ikonki pikselowe 8x8: a biały, b żółty, c zielony, d czerwony, e cyjan, f fiolet
const PAL={a:'#fff',b:'#E3EA9A',c:'#A6E08F',d:'#FF9F90',e:'#9ADCE8',f:'#B3ADFF'};
const ICONS={
 pop:['..aaaa..','..aaaa..','...aa...','.aaaaaa.','a.aaaa.a','..aaaa..','..a..a..','..a..a..'],
 mor:['..bbbb..','.bbbbbb.','bb.bb.bb','bbbbbbbb','b.bbbb.b','bb....bb','.bbbbbb.','..bbbb..'],
 food:['....c...','...c....','.dd.dd..','dddddddd','dddddddd','dddddddd','.dddddd.','..dddd..'],
 energy:['....bb..','...bb...','..bb....','.bbbbbb.','....bb..','...bb...','..bb....','.b......'],
 min:['..eeee..','.eaeeee.','eaeeeeee','eeeeeeee','.eeeeee.','..eeee..','...ee...','........'],
 cr:['..bbbb..','.bbbbbb.','bbbaabbb','bbabbbbb','bbabbbbb','bbbaabbb','.bbbbbb.','..bbbb..'],
 res:['..aaaa..','...aa...','...aa...','..acca..','.acccca.','acccccca','acccccca','.aaaaaa.'],
 work:['.ff..ff.','.ff..ff.','.ffffff.','..ffff..','...ff...','...ff...','...ff...','...ff...'],
 build:['bbbbbb..','bbbbbbf.','bbbbbb.f','...ff...','...ff...','...ff...','...ff...','...ff...'],
 farm:['.cc..cc.','cccccccc','.cccccc.','...cc...','...cc...','.dddddd.','..dddd..','..dddd..'],
 power:['eeeeeeee','eaeaeaea','eeeeeeee','eaeaeaea','eeeeeeee','...ff...','...ff...','.ffffff.'],
 battery:['..aaaa..','.aaaaaa.','.a....a.','.acccca.','.acccca.','.acccca.','.acccca.','.aaaaaa.'],
 store:['bbbbbbbb','bb....bb','b.b..b.b','b..bb..b','b..bb..b','b.b..b.b','bb....bb','bbbbbbbb'],
 mine:['..ffff..','.f.bb.f.','f..bb..f','...bb...','...bb...','...bb...','...bb...','...bb...'],
 house:['........','..aaaa..','.aaaaaa.','aabaabaa','aaaaaaaa','aaa..aaa','aaa..aaa','........'],
 rec:['.dd..dd.','dddddddd','dddddddd','dddddddd','.dddddd.','..dddd..','...dd...','........'],
 lab:['..aaaa..','...aa...','...aa...','..acca..','.acccca.','acccccca','acccccca','.aaaaaa.'],
 shield:['eeeeeeee','eaaeeeee','eaeeeeee','eeeeeeee','eeeeeeee','.eeeeee.','..eeee..','...ee...'],
 port:['...aa...','..aaaa..','..aeea..','..aaaa..','.aaaaaa.','aa.aa.aa','...dd...','..d..d..']
};
const _ic={};
function ico(k){if(_ic[k])return _ic[k];const g=ICONS[k];if(!g)return'';let r='';
 g.forEach((row,y)=>[...row].forEach((ch,x)=>{if(PAL[ch])r+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+PAL[ch]+'"/>'}));
 return _ic[k]='<svg class="ic" viewBox="0 0 8 8" aria-hidden="true">'+r+'</svg>'}

const BATCAP=100,STBASE=150,STCAP=250,MAINT=1,MORK=0.11;
const stCapOf=s=>STBASE+(s.b.store||0)*STCAP;
const GOAL=1000,DAYS=365,YEAR=2150,KEY='kolony-vibe-v2';
const INFRA=['battery','store','house','shield'],JOBS=['build','farm','power','mine','rec','lab','port'];
const PRIO=[[0,'STOP'],[1,'NISKI'],[2,'ŚREDNI'],[3,'WYSOKI']];
const prioOf=(s,k)=>INFRA.includes(k)?9:((s.prio||{})[k]??2);
const jobName=k=>k==='build'?'Budowniczowie':BLD[k].n;
const TABS=[['raport','RAPORT'],['budowa','BUDOWA'],['praca','PRACA'],['rynek','RYNEK'],['polityka','POLITYKA'],['nauka','NAUKA']];
const RATIONS=[[0.75,'Głodowe'],[1,'Normalne'],[1.25,'Obfite']];
const MDAYS=[31,28,31,30,31,30,31,31,30,31,30,31],MNAMES=['STY','LUT','MAR','KWI','MAJ','CZE','LIP','SIE','WRZ','PAŹ','LIS','GRU'];
let S,tab='raport',qty=50,sound=true,actx=null;

function newState(){return{m:1,pop:100,food:300,energy:100,min:200,cr:500,mor:60,rs:null,rp:{},q:[],
 b:{farm:3,power:2,battery:1,store:1,mine:1,house:2,rec:0,lab:0,port:0,shield:0},tax:10,ration:1,tech:{},prio:{},
 pr:{food:4,min:6},prev:null,over:null,
 report:[{k:'txt',t:'Witaj, gubernatorze! Kolonia Nowa Nadzieja liczy 100 osadników.'},{k:'txt',t:'Cel: '+GOAL+' kolonistów w ciągu roku ('+DAYS+' dni).'}],repDays:0}}

function calc(s){
 const t=s.tech,b=s.b,cap=b.house*60,workforce=s.pop*0.6,enCap=(b.battery||0)*BATCAP;
 const af=t.auto?0.75:1,wNeed={},E={};let avail=workforce,nb=0;
 for(const k in BLD){wNeed[k]=b[k]*BLD[k].w*af;nb+=b[k]}
 wNeed.build=s.q.reduce((a,x)=>a+BLD[x.k].crew*af,0);
 // przydział pracowników: najpierw infrastruktura, potem wg priorytetów
 const take=ks=>{const n=ks.reduce((a,k)=>a+wNeed[k],0),r=n>0?Math.min(1,avail/n):1;ks.forEach(k=>E[k]=r);avail-=Math.min(avail,n)};
 take(INFRA);for(const L of[3,2,1])take(JOBS.filter(k=>prioOf(s,k)===L));
 JOBS.filter(k=>prioOf(s,k)===0).forEach(k=>E[k]=0);
 // budowniczowie trafiają na place budowy w kolejności kolejki
 const builders=wNeed.build*E.build;let bl=builders;
 const sites=s.q.map(x=>{const B=BLD[x.k],need=B.crew*af,a=Math.min(bl,need),r=need>0?a/need:0,rate=r*B.crew;bl-=a;
  return{a,need,rate,pct:Math.min(100,x.d/B.bt*100),eta:rate>0?Math.ceil((B.bt-x.d)/rate):Infinity}});
 let needed=0,enNeed=s.pop*0.033;
 for(const k in wNeed)if(prioOf(s,k)>0)needed+=wNeed[k];
 for(const k in BLD)enNeed+=b[k]*BLD[k].en*E[k];
 const e=needed>0?Math.min(1,workforce/needed):1;
 const enProd=b.power*BLD.power.p*E.power*(t.graph?1.3:1);
 const f=enNeed>0?Math.min(1,(s.energy+enProd)/enNeed):1;
 const foodProd=b.farm*BLD.farm.p*E.farm*f*(t.hydro?1.3:1),foodCons=s.pop*0.2*s.ration;
 const minProd=b.mine*BLD.mine.p*E.mine*f*(t.drill?1.3:1),resProd=b.lab*BLD.lab.p*E.lab*f;
 const taxInc=s.pop*s.tax*0.0167,trade=b.port*BLD.port.p*E.port*f,maint=nb*MAINT;
 const unemp=avail;
 const foodAfter=s.food+foodProd-foodCons;
 const shortRatio=foodAfter<0&&foodCons>0?Math.min(1,-foodAfter/foodCons):0;
 const recB=20*(1-Math.pow(0.75,b.rec*E.rec*f));
 const crowd=s.pop>cap?Math.min(40,(s.pop-cap)/Math.max(cap,1)*60):0;
 const unempPen=s.pop>0?unemp/s.pop*30:0,black=(1-f)*30,starv=shortRatio*40;
 let mt=55-(s.tax-10)*1.5+(s.ration-1)*40+recB-crowd-unempPen-black-starv-(s.cr<0?10:0);
 mt=Math.max(0,Math.min(100,mt));
 const stCap=STBASE+(b.store||0)*STCAP,foodWaste=Math.max(0,foodAfter-stCap),minWaste=Math.max(0,s.min+minProd-stCap);
 const enStore=Math.max(0,Math.min(enCap,s.energy+enProd-enNeed*f)),enWaste=Math.max(0,s.energy+enProd-enNeed*f-enCap);
 return{E,wNeed,builders,sites,stCap,foodWaste,minWaste,enCap,enStore,enWaste,cap,workforce,needed,e,f,enProd,enNeed,foodProd,foodCons,minProd,resProd,taxInc,trade,maint,unemp,shortRatio,mt,crowd,unempPen,black,starv,recB};
}

const EVENTS=[
 s=>{if(s.b.shield>0){s.b.shield--;return'Deszcz meteorytów! Osłona orbitalna przechwyciła uderzenie i uległa zniszczeniu. Pozostało osłon: '+s.b.shield+'.'}
   const ks=Object.keys(BLD).filter(k=>s.b[k]>0);if(!ks.length)return null;
   const k=ks[Math.floor(Math.random()*ks.length)];s.b[k]--;s.mor-=4;return'DESZCZ METEORYTÓW! Zniszczony budynek: '+BLD[k].n+'.'},
 s=>{const d=s.pop*(s.tech.med?0.03:0.08);s.pop-=d;s.mor-=5;return'EPIDEMIA! Zmarło '+Math.round(d)+' kolonistów.'},
 s=>{s.food+=100;s.min+=60;return'Statek zaopatrzeniowy z Ziemi: +100 t żywności, +60 t minerałów.'},
 s=>{const l=Math.round(s.energy*0.5);if(l<5)return null;s.energy-=l;return'Rozbłysk słoneczny! Utracono '+l+' kWh energii.'},
 s=>{s.min+=150;return'Geolodzy odkryli złoże kryształów: +150 t minerałów.'},
 s=>{if(s.cr<=0)return null;const l=Math.min(s.cr,Math.max(50,Math.round(s.cr*0.15)));s.cr-=l;s.mor-=3;return'ATAK PIRATÓW! Zrabowano '+l+' kredytów.'},
 s=>{s.mor+=8;return'Święto Założenia Kolonii – morale rośnie.'},
 s=>{s.food+=120;return'Przechwycono lodową kometę: +120 t żywności.'},
 s=>{const free=Math.floor(s.b.house*60-s.pop);if(free<1)return null;const w=15+Math.floor(Math.random()*15),n=Math.min(w,free);s.pop+=n;
   return'Przybyli uchodźcy z upadłej stacji: +'+n+' kolonistów.'+(n<w?' Dla '+(w-n)+' zabrakło miejsca – polecieli dalej.':'')},
 s=>{s.energy=Math.max(0,s.energy-60);s.mor-=4;return'Awaria zasilania: −60 kWh energii.'}
];

// raport: wpisy z danymi, które przy wielu dniach się sumują
const R=Math.round,ws=d=>d>1?'w sumie ':'',dd=d=>d>1?' (przez '+daysTxt(d)+')':'';
const REP={
 waste:{c:'warn',f:(v,d)=>R(v.a)<1?null:'Baterie pełne – zmarnowano '+ws(d)+R(v.a)+' kWh energii'+dd(d)+'.'},
 hunger:{c:'neg',f:(v,d)=>'GŁÓD! '+(R(v.a)===1?'Zmarł '+ws(d)+'1 kolonista':'Zmarło '+ws(d)+R(v.a)+' kolonistów')+dd(d)+'.'},
 stall:{c:'warn',f:(v,d)=>'Budowa stoi'+dd(d)+' – nikt nie pracuje na placach budowy. Zmień priorytet budowniczych w zakładce PRACA.'},
 short:{c:'warn',f:(v,d)=>'Brak rąk do pracy'+dd(d)+' – brakuje '+v._miss+' '+(v._miss===1?'pracownika':'pracowników')+'. Niedoobsadzone: '+v._low+'. Priorytety ustawisz w zakładce PRACA.'},
 black:{c:'neg',f:(v,d)=>'BLACKOUT'+dd(d)+'! Zasilanie pokrywa '+(d>1?'średnio ':'')+R(v.p/d)+'% potrzeb.'},
 crowd:{c:'warn',f:(v,d)=>'Przeludnienie'+dd(d)+' – zbuduj moduły mieszkalne.'},
 born:{c:'',f:(v,d)=>R(v.a)<1?null:(R(v.a)===1?'Urodził się '+ws(d)+'1 nowy kolonista.':'Urodziło się '+ws(d)+R(v.a)+' nowych kolonistów.')},
 imm:{c:'',f:(v,d)=>R(v.a)<1?null:'Port: '+(R(v.a)===1?'przybył '+ws(d)+'1 imigrant.':'przybyło '+ws(d)+R(v.a)+' imigrantów.')},
 emig:{c:'neg',f:(v,d)=>R(v.a)<1?null:'Niezadowoleni koloniści odlatują: '+ws(d)+'−'+R(v.a)+dd(d)+'.'},
 debt:{c:'neg',f:(v,d)=>'Kolonia jest zadłużona'+dd(d)+'! Morale spada.'},
 loss:{c:'warn',f:(v,d)=>{const f=R(v.f),m=R(v.m);if(f<1&&m<1)return null;return'Magazyny pełne – stracono '+ws(d)+(f>=1?f+' t żywności':'')+(f>=1&&m>=1?' i ':'')+(m>=1?m+' t minerałów':'')+'.'}},
 nores:{c:'warn',f:(v,d)=>'Laboratoria nie mają projektu'+dd(d)+' – wybierz technologię w zakładce NAUKA.'}
};
function mergeRep(old,neu){for(const e of neu){const o=e.k==='txt'?null:old.find(x=>x.k===e.k);
 if(!o){old.push(e);continue}o.d++;for(const f in e.v)o.v[f]=f[0]==='_'?e.v[f]:(o.v[f]||0)+e.v[f]}}
function repLines(s){const D=s.repDays||1,rp=s.report||[];
 const L=[...rp.filter(e=>e.top),...rp.filter(e=>!e.top)].map(e=>{
  if(typeof e==='string')return e;
  if(e.k==='txt')return'<span class="'+(e.c||'')+'">'+(D>1&&e.day?'Dzień '+e.day+': ':'')+e.t+'</span>';
  const t=REP[e.k].f(e.v,e.d);return t&&'<span class="'+REP[e.k].c+'">'+t+'</span>'}).filter(Boolean);

function endTurn(quiet,acc){
 if(S.over)return true;
 const s=S,c=calc(s),r=[];let imp=false;
 const add=(k,v)=>r.push({k,v:v||{},d:1}),note=(t,cl)=>r.push({k:'txt',t,c:cl,day:s.m,top:1});
 s.prev={pop:s.pop,food:s.food,energy:s.energy,min:s.min,cr:s.cr,mor:s.mor};
 s.energy=c.enStore;
 if(c.enWaste>0.01)add('waste',{a:c.enWaste});
 s.food+=c.foodProd-c.foodCons;
 let deaths=0;
 if(s.food<0){deaths=s.pop*0.066*c.shortRatio;s.food=0;if(!s.wasHungry)imp=true;add('hunger',{a:deaths})}
 s.min+=c.minProd;s.cr+=c.taxInc+c.trade-c.maint;
 s.mor+=(c.mt-s.mor)*MORK;
 // postęp budowy
 if(s.q.length){s.q.forEach((x,i)=>x.d+=c.sites[i].rate);
  s.q=s.q.filter(x=>{if(x.d<BLD[x.k].bt)return true;s.b[x.k]++;imp=true;note('★ Ukończono budowę: '+BLD[x.k].n+'.','pos');beep(520,.12);return false});
  if(s.q.length&&c.builders<0.5)add('stall')}
 if(c.e<1){const miss=Math.ceil(c.needed-c.workforce),low=[...Object.keys(BLD).filter(k=>s.b[k]),...(c.wNeed.build?['build']:[])].filter(k=>prioOf(s,k)>0&&c.E[k]<1).map(k=>jobName(k)+' '+Math.floor(c.E[k]*100)+'%');
  add('short',{_miss:miss,_low:low.join(', ')})}
 if(c.f<1&&!s.wasBlack)imp=true;
 if(c.f<1)add('black',{p:c.f*100});
 if(c.crowd>0)add('crowd');
 if(!deaths&&s.pop<c.cap){const g=Math.min(s.pop*0.0082*(s.mor/60)*(s.tech.med?1.3:1),c.cap-s.pop);s.pop+=g;if(g>0)add('born',{a:g})}
 if(s.b.port&&s.mor>55&&s.pop<c.cap){const im=Math.min(1.5+Math.random()*3.5,c.cap-s.pop);s.pop+=im;if(im>0)add('imm',{a:im})}
 if(s.mor<25){if(!s.wasLow)imp=true;const em=s.pop*0.01;s.pop-=em;add('emig',{a:em})}
 s.pop-=deaths;
 if(s.m>10&&Math.random()<0.1){const m=EVENTS[Math.floor(Math.random()*EVENTS.length)](s);if(m){imp=true;note('★ '+m,'sub');beep(220,.25)}}
 for(const k in s.pr){const b=RES[k].base;s.pr[k]=Math.max(b*0.5,Math.min(b*2,s.pr[k]*(1+(Math.random()-0.5)*0.14)))}
 if(s.cr<0)add('debt');
 s.mor=Math.max(0,Math.min(100,s.mor));s.pop=Math.max(0,s.pop);s.energy=Math.min(s.energy,(s.b.battery||0)*BATCAP);
 {const l=clampStore(s);if(l.food>0||l.min>0)add('loss',{f:l.food,m:l.min})}
 if(s.rs&&c.resProd>0){const k=s.rs,t=TECH[k];s.rp[k]=(s.rp[k]||0)+c.resProd;
  if(s.rp[k]>=t.c){imp=true;s.tech[k]=1;delete s.rp[k];s.rs=null;note('★ Naukowcy ukończyli projekt: '+t.n+'! '+t.d+'. Wybierz kolejny w zakładce NAUKA.','pos');beep(990,.15)}}
 else if(!s.rs&&c.resProd>0&&nextTech(s))add('nores');
 s.wasHungry=deaths>0;s.wasBlack=c.f<1;s.wasLow=s.mor<25;
 s.m++;
 if(acc&&Array.isArray(s.report)){mergeRep(s.report,r);s.repDays=(s.repDays||1)+1}else{s.report=r;s.repDays=1}
 if(s.pop>=GOAL)s.over={win:true,t:'ZWYCIĘSTWO!',d:'Kolonia osiągnęła '+GOAL+' mieszkańców. Rada Ziemi przyznaje ci order Pioniera.'};
 else if(s.pop<10)s.over={win:false,t:'KOLONIA UPADŁA',d:'Zostało zbyt mało osadników, by przetrwać.'};
 else if(s.mor<=5)s.over={win:false,t:'BUNT!',d:'Koloniści przejęli władzę i odesłali cię na Ziemię.'};
 else if(s.cr<-500)s.over={win:false,t:'BANKRUCTWO',d:'Długi przekroczyły 500 kredytów. Korporacja przejmuje kolonię.'};
 else if(s.m>DAYS)s.over={win:false,t:'KONIEC KADENCJI',d:'Minął rok. Nie osiągnąłeś celu, ale kolonia przetrwała.'};
 save();tab='raport';render();if(!quiet)beep(660,.06);
 if(s.over){showEnd();imp=true}
 return imp;
}

function clampStore(s){const c=stCapOf(s),l={food:Math.max(0,s.food-c),min:Math.max(0,s.min-c)};s.food-=l.food;s.min-=l.min;return l}
function score(s){return Math.round(s.pop+s.mor*5+Math.max(0,s.cr)/10+Object.keys(s.tech).length*50+(s.over&&s.over.win?(DAYS-s.m)*7:0))}

function load(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}

 return'<div class="small">Wybierz technologię, a naukowcy z laboratoriów będą nad nią codziennie pracować ('+num(c.resProd)+' pkt/dzień). Postęp nie przepada, gdy zmienisz projekt.'+(s.b.lab?'':' <span class="warn">Zbuduj laboratorium, żeby prowadzić badania.</span>')+'</div>'+Object.entries(TECH).map(([k,t])=>{const on=s.rs===k,pc=techPct(s,k);
 return'<div class="card"><div class="row"><span class="t">'+t.n+'</span>'+(s.tech[k]?'<span class="pos">ODKRYTE</span>':on?'<span class="warn">BADANE · '+Math.floor(pc)+'%</span>':'<button data-tech="'+k+'">'+(pc>0?'WZNÓW ('+Math.floor(pc)+'%)':'BADAJ')+'</button>')+'</div>'+
 '<div class="small">'+t.d+' · koszt '+t.c+' pkt'+(on?' · '+techEta(s,k,c):'')+'</div>'+(s.tech[k]?'':bar(pc,100,on?'':'warn'))+'</div>'}).join('');
}

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;initAudio();
 const d=b.dataset,s=S;
 if(d.tab){tab=d.tab;beep(880,.03)}
 else if(d.build){const x=BLD[d.build];s.cr-=x.cr;s.min-=x.mi;s.q.push({k:d.build,d:0});beep(520,.08);save()}
 else if(d.cancel){const x=s.q.splice(+d.cancel,1)[0];if(x){s.cr+=Math.round(BLD[x.k].cr/2);s.min+=Math.round(BLD[x.k].mi/2);clampStore(s)}beep(180,.08);save()}
 else if(d.first){const x=s.q.splice(+d.first,1)[0];if(x)s.q.unshift(x);beep(600,.03);save()}
 else if(d.demo){s.b[d.demo]--;s.energy=Math.min(s.energy,(s.b.battery||0)*BATCAP);clampStore(s);beep(180,.08);save()}
 else if(d.qty){qty=+d.qty}
 else if(d.sell){s[d.sell]-=qty;s.cr+=prices(s,d.sell).sell*qty;beep(740,.05);save()}
 else if(d.buy){s.cr-=prices(s,d.buy).buy*qty;s[d.buy]+=qty;beep(740,.05);save()}
 else if(d.ration){s.ration=+d.ration;save()}
 else if(d.prio){const[k,l]=d.prio.split(':');s.prio[k]=+l;beep(600,.03);save()}
 else if(d.tech){s.rs=d.tech;beep(880,.08);save()}
 else if(d.act){act(d.act);return}
 else if(d.dv){devAct(d.dv);return}
 else return;
 render();
});
document.addEventListener('input',e=>{if(e.target.id==='tax'){S.tax=+e.target.value;const l=e.target.parentNode.querySelector('.row .t:last-child');if(l)l.textContent=S.tax+'%'}});
document.addEventListener('change',e=>{if(e.target.id==='tax'){S.tax=+e.target.value;save();render()}
 const t=e.target;
 if(t.dataset.dev){const ps=t.dataset.dev.split('.');let o=S;while(ps.length>1)o=o[ps.shift()];o[ps[0]]=+t.value||0;save();render()}
 if(t.dataset.devtech){if(t.checked){S.tech[t.dataset.devtech]=1;if(S.rs===t.dataset.devtech)S.rs=null}else delete S.tech[t.dataset.devtech];save();render()}});
let busy=false;
function advance(n){initAudio();if(busy||S.over)return;busy=true;go.disabled=go7.disabled=true;
 const el=document.createElement('div'),p0={pop:S.pop,food:S.food,energy:S.energy,min:S.min,cr:S.cr,mor:S.mor};el.className='tw';
 el.innerHTML='<div class="twb"><div class="twt"></div><div class="meter"><i></i></div></div>';
 const lab=el.querySelector('.twt'),fill=el.querySelector('.meter i');
 const show=()=>{lab.innerHTML='DZIEŃ '+Math.min(S.m+1,DAYS)+'<br>'+dateOf(S.m+1)};
 show();document.body.appendChild(el);
 let i=0;
 const step=()=>{const imp=endTurn(n>1,i>0);i++;fill.style.width=(n>1?i/n*100:100)+'%';beep(330+i*60,.04);
  if(i<n&&!imp&&!S.over){show();setTimeout(step,90)}else finish()};
 const finish=()=>{if(n>1){S.prev=p0;if(i<n&&!S.over)S.report.unshift({k:'txt',t:'Przewijanie zatrzymane po '+i+' '+(i===1?'dniu':'dniach')+' – ważne wydarzenie.',c:'sub',top:1});save();render();beep(660,.06)}
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>{el.remove();busy=false;render()},200)},n>1?150:200)};
 setTimeout(step,n>1?120:200)}
go.onclick=()=>advance(1);
go7.onclick=()=>advance(7);
menu.onclick=()=>{initAudio();showMenu()};

// menu deweloperskie – widoczne tylko z #iddqd w adresie
const EVNAMES=['Deszcz meteorytów','Epidemia','Statek zaopatrzeniowy','Rozbłysk słoneczny','Złoże kryształów','Atak piratów','Święto Założenia','Lodowa kometa','Uchodźcy','Awaria zasilania'];
function devCheck(){dev.classList.toggle('hidden',location.hash!=='#iddqd')}
window.addEventListener('hashchange',devCheck);devCheck();
dev.onclick=()=>{initAudio();showDev()};
let devMsg='';
function showDev(){const s=S,c=calc(s);
 const num=(lab,path,v)=>'<label>'+lab+'<input type="number" data-dev="'+path+'" value="'+Math.round(v*100)/100+'"></label>';
 show('<h1>DEV · IDDQD</h1>'+(devMsg?'<p class="sub">'+devMsg+'</p>':'')+
  '<div class="devh">STAN</div><div class="dev">'+num('Dzień','m',s.m)+num('Koloniści','pop',s.pop)+num('Morale %','mor',s.mor)+num('Żywność t','food',s.food)+num('Energia kWh','energy',s.energy)+num('Minerały t','min',s.min)+num('Kredyty','cr',s.cr)+num('Podatki %','tax',s.tax)+num('Cena żywn.','pr.food',s.pr.food)+num('Cena min.','pr.min',s.pr.min)+'</div>'+
  '<div class="devh">BUDYNKI</div><div class="dev">'+Object.keys(BLD).map(k=>num(BLD[k].n,'b.'+k,s.b[k])).join('')+'</div>'+
  (s.q.length?'<div class="devh">PLACE BUDOWY (wykonana praca)</div><div class="dev">'+s.q.map((x,i)=>num(BLD[x.k].n+' /'+BLD[x.k].bt,'q.'+i+'.d',x.d)).join('')+'</div>':'')+
  '<div class="devh">TECHNOLOGIE (odkryta · postęp w pkt)</div><div class="dev" style="grid-template-columns:repeat(auto-fill,minmax(270px,1fr))">'+Object.keys(TECH).map(k=>'<label>'+TECH[k].n+'<span><input type="checkbox" data-devtech="'+k+'"'+(s.tech[k]?' checked':'')+'> <input type="number" data-dev="rp.'+k+'" value="'+Math.round(s.rp[k]||0)+'" title="postęp /'+TECH[k].c+'"></span></label>').join('')+'</div>'+
  '<div class="devh">AKCJE</div><div class="btns" style="margin-top:4px">'+
  '<button data-dv="finish">UKOŃCZ BUDOWY</button><button data-dv="fill">NAPEŁNIJ MAGAZYNY</button><button data-dv="cash">+1000 KR</button><button data-dv="alltech">WSZYSTKIE TECHNOLOGIE</button>'+
  '<button data-dv="skip7">+7 DNI</button><button data-dv="skip30">+30 DNI</button><button data-dv="revive">WZNÓW GRĘ PO KOŃCU</button></div>'+
  '<div class="devh">WYWOŁAJ ZDARZENIE</div><div class="btns" style="margin-top:4px">'+EVNAMES.map((n,i)=>'<button data-dv="ev'+i+'">'+n+'</button>').join('')+'</div>'+
  '<div class="btns"><button data-act="close">ZAMKNIJ</button></div>')}
function devAct(a){const s=S;devMsg='';
 if(a==='finish'){s.q.forEach(x=>s.b[x.k]++);devMsg='Ukończono budów: '+s.q.length+'.';s.q=[]}
 else if(a==='fill'){const c=calc(s);s.food=s.min=c.stCap;s.energy=c.enCap;devMsg='Magazyny pełne.'}
 else if(a==='cash'){s.cr+=1000;devMsg='+1000 kr.'}
 else if(a==='alltech'){for(const k in TECH)s.tech[k]=1;s.rs=null;s.rp={};devMsg='Odkryto wszystkie technologie.'}
 else if(a==='revive'){s.over=null;devMsg='Gra wznowiona.'}
 else if(a==='skip7'||a==='skip30'){const n=a==='skip7'?7:30;let i=0;const p0={pop:s.pop,food:s.food,energy:s.energy,min:s.min,cr:s.cr,mor:s.mor};
  while(i<n&&!S.over){endTurn(true,i>0);i++}S.prev=p0;devMsg='Przewinięto '+i+' dni bez zatrzymywania.';if(S.over)return}
 else if(a.startsWith('ev')){const m=EVENTS[+a.slice(2)](s);devMsg=m?'★ '+m:'Zdarzenie nie miało zastosowania.';
  if(m){if(!Array.isArray(s.report))s.report=[];s.report.unshift({k:'txt',t:'★ '+m,c:'sub',day:s.m,top:1})}}
 s.mor=Math.max(0,Math.min(100,s.mor));save();render();showDev()}

function act(a){
 if(a==='new'){S=newState();tab='raport';save();hide();render()}
 else if(a==='cont'){hide();render()}
 else if(a==='help')showHelp();
 else if(a==='about')showAbout();
 else if(a==='close')hide();
 else if(a==='sound'){sound=!sound;showMenu()}
}
function show(h){ovbox.innerHTML=h;ov.classList.remove('hidden')}
function hide(){ov.classList.add('hidden')}
function showMenu(){show('<h1>MENU</h1><div class="btns"><button data-act="close">WRÓĆ DO GRY</button><button data-act="help">ZASADY</button><button data-act="about">O GRZE</button><button data-act="sound">DŹWIĘK: '+(sound?'WŁ.':'WYŁ.')+'</button><button data-act="new">NOWA GRA</button></div>')}
function showHelp(){show('<h1>ZASADY</h1><p>Jesteś gubernatorem kolonii na odległej planecie. Każda tura to jeden dzień. Masz rok ('+DAYS+' dni), żeby kolonia urosła do '+GOAL+' mieszkańców.</p>'+
 '<p>• 60% kolonistów pracuje. Najpierw obsadzane są mieszkania, magazyny, baterie i osłony, potem reszta zadań (budynki i budowniczowie) wg priorytetów z zakładki PRACA. Zatrzymany budynek nie produkuje ani nie zużywa energii, a jego pracownicy są bezrobotni.<br>• Budowa trwa. Każdy budynek wymaga określonej ilości pracy – im większy, tym więcej. Więcej budowniczych kończy budowę szybciej, ale zabiera ludzi z produkcji. Anulowana budowa zwraca połowę kosztów.<br>• Budynki zużywają energię. Gdy jej brakuje, produkcja spada, a ludzie są źli.<br>• Energii nie da się kupić ani sprzedać. Nadwyżkę zmagazynujesz tylko w bateriach (po '+BATCAP+' kWh każda), resztę tracisz.<br>• Żywność i minerały trzymasz w magazynach ('+STBASE+' t bazowo + '+STCAP+' t za każdy magazyn). Nadmiar przepada.<br>• Ludzie rosną w liczbie tylko, gdy mają gdzie mieszkać i co jeść.<br>• Wysokie podatki i głodowe racje obniżają morale. Przy morale 5% wybucha bunt.<br>• Laboratoria codziennie posuwają naprzód wybraną w zakładce NAUKA technologię.<br>• Dług powyżej 500 kr oznacza bankructwo.<br>• Nadwyżki żywności i minerałów sprzedawaj na rynku, ceny zmieniają się codziennie.</p>'+
 '<div class="btns"><button data-act="'+(S?'close':'new')+'">'+(S?'WRÓĆ':'START')+'</button></div>')}
function showAbout(){show('<h1>O GRZE</h1><p><span style="color:var(--white)">KOLONY VIBE</span><br>Wersja 0.1 Prototyp<br><br>Strategiczna gra ekonomiczna o zarządzaniu kolonią na odległej planecie, w klimacie 8-bitowych komputerów.</p>'+
 '<p><span class="sub">POMYSŁ, PROJEKT I TESTY</span><br><span style="color:var(--white)">Dominik &quot;Socek&quot; Długajczyk</span></p>'+
 '<p><span class="sub">IMPLEMENTACJA</span><br><span style="color:var(--white)">Claude</span> – model AI firmy Anthropic (Claude Opus 5.5, Claude Code). Cały kod gry napisał Claude według wskazówek autora.</p>'+
 '<p class="small">(C) 2026</p><div class="btns"><button data-act="close">WRÓĆ</button></div>')}
function showEnd(){const o=S.over;show('<h1 class="'+(o.win?'pos':'neg')+'">'+o.t+'</h1><p>'+o.d+'</p><p>Koloniści: '+fmt(S.pop)+' · Morale: '+Math.round(S.mor)+'%<br>Dzień: '+Math.min(S.m,DAYS)+' · Technologie: '+Object.keys(S.tech).length+'</p><p class="t" style="color:var(--yellow)">WYNIK: '+score(S)+'</p><div class="btns"><button data-act="new">NOWA GRA</button><button data-act="close">ZOBACZ KOLONIĘ</button></div>');beep(o.win?880:150,.4)}

function initAudio(){if(actx||!sound)return;try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function beep(f,d){if(!sound||!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=f;g.gain.value=0.04;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d);o.stop(actx.currentTime+d+0.02)}catch(e){}}

// ekran startowy
(function boot(){
 const saved=load();
 const lines=['KOLONY VIBE','WERSJA 0.1 PROTOTYP · (C) 2026','','READY.','LOAD "KOLONY VIBE",8,1','SEARCHING FOR KOLONY VIBE','LOADING','READY.'];
 let i=0;ovbox.innerHTML='<div id="bt"></div>';
 const t=setInterval(()=>{
  if(i<lines.length){bt.innerHTML+=lines[i]+'<br>';i++}
  else{clearInterval(t);bt.innerHTML+='RUN<span class="cursor"></span><div class="btns">'+(saved&&!saved.over?'<button data-act="cont" id="contb">KONTYNUUJ (dzień '+saved.m+')</button>':'')+'<button data-act="new">NOWA GRA</button><button data-act="help">ZASADY</button><button data-act="about">O GRZE</button></div>';
   if(saved&&!saved.over)S=saved;}
 },220);
 S=saved&&!saved.over?saved:newState();
 render();
})();
</script>
